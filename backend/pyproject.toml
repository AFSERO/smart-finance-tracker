[project]
name = "smart-finance-backend"
version = "0.1.0"
description = "FastAPI backend for Smart Finance Tracker"
authors = [{name = "Smart Finance Tracker"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.0",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "requests>=2.31"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "faker>=19.6"
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
